name: Sync live scores

on:
  # Cron disabled while the site is inactive (was every 10 min, 24/7 —
  # each commit triggers a Netlify rebuild). Re-add the schedule to resume.
  # schedule:
  #   - cron: '*/10 * * * *'
  workflow_dispatch:          # manual "Run workflow" button

permissions:
  contents: write             # lets the job commit matches.json

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch standings and update Supabase
        run: node scripts/sync-scores.mjs
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
      - name: Commit updated match schedule
        run: |
          if ! git diff --quiet matches.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add matches.json
            git commit -m "Update match schedule data"
            git push
          else
            echo "matches.json unchanged"
          fi
