name: Sync live scores

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch:          # manual "Run workflow" button

permissions:
  contents: write             # lets the job commit matches.json

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch standings and update Supabase
        run: node scripts/sync-scores.mjs
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
      - name: Commit updated match schedule
        run: |
          if ! git diff --quiet matches.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add matches.json
            git commit -m "Update match schedule data"
            git push
          else
            echo "matches.json unchanged"
          fi
