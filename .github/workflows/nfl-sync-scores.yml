name: Sync NFL live scores

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch:          # manual "Run workflow" button

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch NFL standings/schedule and update Supabase
        run: node nfl/scripts/sync-scores.mjs
